<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF6EC" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Cafe Tycoon - game quản lý quán cà phê: pha chế, phục vụ khách, nâng cấp quán và mở rộng chuỗi. Chơi trực tiếp trên trình duyệt."
    />
    <title>Cafe Tycoon — Quản lý quán cà phê</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236F4E37'/%3E%3Cpath d='M17 24h24v13a11 11 0 0 1-11 11h-2a11 11 0 0 1-11-11z' fill='%23FDF6EC'/%3E%3Cpath d='M41 27h4.5a6.5 6.5 0 0 1 0 13H41' fill='none' stroke='%23FDF6EC' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="hud" id="hud"></header>
      <main class="stage">
        <canvas id="scene" aria-label="Sân quán cà phê — bấm vào khách có ly để phục vụ"></canvas>
        <div class="event-chips empty" id="event-chips" aria-live="polite"></div>
        <div class="toasts" id="toasts" aria-live="polite"></div>
        <div class="paused-note" id="paused-note" hidden>
          <span>Tạm dừng</span>
          <button class="btn primary" data-action="pause">Chơi tiếp</button>
        </div>
        <p class="hint" id="hint" hidden>Bấm vào khách có ly ☕ để phục vụ và nhận thêm tip.</p>
      </main>
      <aside class="panel" aria-label="Bảng nâng cấp và thực đơn">
        <nav class="tabs" id="tabs" aria-label="Danh mục"></nav>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </div>
    <div class="overlay" id="overlay"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        Trò chơi cần JavaScript để chạy. Hãy bật JavaScript rồi tải lại trang.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
